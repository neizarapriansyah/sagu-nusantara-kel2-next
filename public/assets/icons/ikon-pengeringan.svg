    <!-- inti matahari -->
    <circle cx="50" cy="50" r="23" fill="url(#matahari)" stroke="#d9861c" stroke-width="3"/>

    <!-- kilau -->
    <path d="M36 44 A15 15 0 0 1 46 34" fill="none" stroke="#ffffff"
