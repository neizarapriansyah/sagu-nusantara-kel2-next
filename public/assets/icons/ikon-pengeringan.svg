        <use href="#sinar" transform="rotate(90 50 50)"/>
        <use href="#sinar" transform="rotate(120 50 50)"/>
        <use href="#sinar" transform="rotate(150 50 50)"/>
        <use href="#sinar" transform="rotate(180 50 50)"/>
        <use href="#sinar" transform="rotate(210 50 50)"/>
        <use href="#sinar" transform="rotate(240 50 50)"/>
        <use href="#sinar" transform="rotate(270 50 50)"/>
        <use href="#sinar" transform="rotate(300 50 50)"/>
        <use href="#sinar" transform="rotate(330 50 50)"/>
