<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="bakul" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#b2824b"/>
            <stop offset="0.45" stop-color="#d8ac72"/>
            <stop offset="1" stop-color="#a87841"/>
        </linearGradient>
        <linearGradient id="tepung" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#ece3d2"/>
        </linearGradient>
        <!-- motif anyaman -->
        <pattern id="anyaman" width="7" height="7" patternUnits="userSpaceOnUse">
            <path d="M0 0 L7 7 M7 0 L0 7" stroke="#7a5128" stroke-width="1.1" opacity="0.5"/>
        </pattern>
    </defs>

    <!-- gundukan tepung -->
    <path d="M20 42 Q28 24 46 15 Q50 13 54 15 Q72 24 80 42 Z"
          fill="url(#tepung)" stroke="#cbbd9f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M40 22 Q34 28 30 36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <g fill="#d9ccb2">
        <circle cx="58" cy="27" r="1.2"/>
        <circle cx="66" cy="34" r="1"/>
        <circle cx="48" cy="33" r="1"/>
    </g>

    <!-- badan bakul -->
    <path d="M18 44 L82 44 L74 88 Q50 95 26 88 Z" fill="url(#bakul)"/>
    <path d="M18 44 L82 44 L74 88 Q50 95 26 88 Z" fill="url(#anyaman)"
          stroke="#6e4428" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="none" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round">
        <path d="M21 60 Q50 65 79 60"/>
        <path d="M24 75 Q50 80 76 75"/>
    </g>

    <!-- bibir bakul -->
    <rect x="13" y="38" width="74" height="10" rx="5"
          fill="#a87841" stroke="#6e4428" stroke-width="2.5"/>
    <path d="M19 41.5 L81 41.5" stroke="#d8ac72" stroke-width="2" stroke-linecap="round"/>
</svg>
