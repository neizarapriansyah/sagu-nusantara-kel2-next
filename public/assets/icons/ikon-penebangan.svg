<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="kayu" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7a4a26"/>
            <stop offset="0.5" stop-color="#b57a45"/>
            <stop offset="1" stop-color="#7a4a26"/>
        </linearGradient>
        <linearGradient id="besi" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b9c1c6"/>
            <stop offset="1" stop-color="#5d666c"/>
        </linearGradient>
    </defs>

    <!-- kapak digambar tegak lalu dimiringkan -->
    <g transform="translate(50 50) rotate(35) scale(0.82) translate(-50 -50)">
        <!-- gagang kayu -->
        <path d="M46 10 L54 10 C55 40 58 70 57 90 Q52 97 47 91 C47 70 45 40 46 10 Z"
              fill="url(#kayu)" stroke="#4e3019" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M49 30 C49 50 50 70 51 86" fill="none" stroke="#d9a877"
              stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

        <!-- mata kapak -->
        <path d="M58 12 L58 32 L42 30 L22 44 Q14 24 22 4 L42 16 Z"
              fill="url(#besi)" stroke="#3b4247" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- sisi tajam yang mengilap -->
        <path d="M22.5 8 Q17 24 22.5 40" fill="none" stroke="#eef2f4"
              stroke-width="3" stroke-linecap="round"/>
        <circle cx="52" cy="22" r="2" fill="#3b4247"/>
    </g>
</svg>
